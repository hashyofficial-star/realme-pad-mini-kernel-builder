name: Build realme Pad Mini Kernel (KernelSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev libelf-dev \
            pkg-config dos2unix ccache zip curl git wget python3 libtinfo5

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: realme-kernel-opensource/realme_PadMini-AndroidR-kernel-source
          ref: master
          path: kernel

      - name: Fix Kconfig & DTC Build Configuration
        run: |
          cd $GITHUB_WORKSPACE/kernel
          echo "==> Cleaning CRLF line endings in Kconfig files..."
          find . -name "Kconfig*" -type f -exec dos2unix {} +

          echo "==> Patching scripts/dtc/Makefile for NO_YAML compilation..."
          sed -i '/yamltree.o/d' scripts/dtc/Makefile
          echo "HOSTCFLAGS_dtc.o += -DNO_YAML" >> scripts/dtc/Makefile
          echo "HOSTCFLAGS_dtc-lexer.lex.o += -DNO_YAML" >> scripts/dtc/Makefile

      - name: Download Toolchains (Clang + GCC)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain

          echo "Downloading Android Clang r383902b..."
          mkdir clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz
          tar -xf clang-r383902b.tar.gz -C clang
          rm clang-r383902b.tar.gz

          echo "Cloning GCC toolchains..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Integrate KernelSU Next & SUSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel

          # 1. Setup KernelSU Next
          echo "==> Setting up KernelSU Next (Legacy mode)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep -q "kernelsu" drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

          # 2. Inject VFS hooks for 4.14 non-kprobe kernel
          echo "==> Injecting manual VFS hooks..."
          if [ -f "drivers/kernelsu/integrate-no-kprobe.py" ]; then
            python3 drivers/kernelsu/integrate-no-kprobe.py
          elif [ -f "drivers/kernelsu/kernel/integrate-no-kprobe.py" ]; then
            python3 drivers/kernelsu/kernel/integrate-no-kprobe.py
          fi

          # 3. Clone SUSFS4KSU (kernel-4.14)
          cd $GITHUB_WORKSPACE
          git clone -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git

          # 4. Patch KernelSU Next for SUSFS (Non-interactive)
          echo "==> Patching KernelSU Next for SUSFS..."
          KSU_DIR="$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
          if [ -d "$KSU_DIR" ]; then
            cd "$KSU_DIR"
            patch -p1 --forward < $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || \
            patch -p2 --forward < $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          fi

          # 5. Copy SUSFS core kernel files
          cd $GITHUB_WORKSPACE/kernel
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

          # 6. Patch Kernel 4.14 Source for SUSFS (Non-interactive)
          echo "==> Patching Kernel 4.14 Source for SUSFS..."
          patch -p1 --forward < $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel

          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64

          echo "==> Generating na500 defconfig..."
          make O=out na500_defconfig

          echo "==> Enforcing KernelSU-Next and SUSFS flags in out/.config..."
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_SU

          make O=out olddefconfig

          echo "==> Starting compilation..."
          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi

          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/dtb
          fi

          cd AnyKernel3
          zip -r9 ../realme_PadMini-KernelSU-SUSFS.zip * -x .git\* README.md

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: realme_PadMini-KernelSU-SUSFS
          path: realme_PadMini-KernelSU-SUSFS.zip
